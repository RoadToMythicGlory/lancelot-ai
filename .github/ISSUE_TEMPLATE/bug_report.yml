name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Broadcast Planning, MCR / Flight Board, External Broadcasts, Shifts, Warehouse, Graphics (Vizrt), Rights / Media, Users & RBAC, Chat, AI Copilot, Excel import, API / External API, Deployment / Docker, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Commit / version
      placeholder: e.g. main @ abc1234
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, Docker or local
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real schedules, credentials, or personal data
          required: true
