version: '3.8'

services:


  # MongoDB - Broadcast Templates & Configs
  #
  # MONGO_USERNAME and MONGO_PASSWORD MUST be supplied via a local `.env` file
  # (or the shell environment). Compose will fail fast if either is missing.
  mongodb:
    image: mongo:7
    container_name: broadcast-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: lancelot
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./services/database/mongodb:/docker-entrypoint-initdb.d
    networks:
      - broadcast-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway - Broadcast GraphQL API
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: broadcast-api-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 64)}
      MONGODB_URL: mongodb://${MONGO_USERNAME:?MONGO_USERNAME must be set in .env}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}@mongodb:27017/lancelot?authSource=admin
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - broadcast-network
    restart: unless-stopped

  # Web Frontend - Broadcast Planning UI
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/graphql}
    container_name: broadcast-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/graphql}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - broadcast-network
    restart: unless-stopped

  # Excel Parser Service - Broadcast Schedule Import
  excel-parser:
    build:
      context: ./services/excel-parser
      dockerfile: Dockerfile
    container_name: broadcast-excel-parser
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      GRAPHQL_URL: http://api-gateway:4000/graphql
    ports:
      - "3002:3002"
    depends_on:
      - api-gateway
    networks:
      - broadcast-network
    restart: unless-stopped

  # AI Agent Service - Local LLM-powered assistant
  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: broadcast-ai-agent
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_AGENT_PORT: 4001
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # aya-expanse:8b is multilingual (Hebrew + English) without Chinese drift.
      # Override LLM_HEBREW_MODEL to e.g. dictalm2.0 if you want a Hebrew-fine-tuned model.
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-aya-expanse:8b}
      LLM_HEBREW_MODEL: ${LLM_HEBREW_MODEL:-aya-expanse:8b}
      MONGODB_URL: mongodb://${MONGO_USERNAME:?MONGO_USERNAME must be set in .env}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}@mongodb:27017/broadcast?authSource=admin
      MONGO_DATABASE: broadcast
      SHIFT_SOLVER_ENGINE: ${SHIFT_SOLVER_ENGINE:-ortools}
      OR_TOOLS_SOLVER_URL: http://or-tools-solver:5003
      RSS_PIPELINE_ENABLED: "true"
      # Curated markdown corpus indexed for help-search ("how do I..." Qs).
      AI_KNOWLEDGE_DIR: ${AI_KNOWLEDGE_DIR:-/app/knowledge/user-manual}
    ports:
      - "4001:4001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Mount the repo's user-manual read-only so the AI can RAG over it.
      - ./docs/user-manual:/app/knowledge/user-manual:ro
    networks:
      - broadcast-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OR-Tools Shift Solver - Constraint optimization service
  or-tools-solver:
    build:
      context: ./services/or-tools-solver
      dockerfile: Dockerfile
    container_name: broadcast-or-tools-solver
    ports:
      - "5003:5003"
    networks:
      - broadcast-network
    restart: unless-stopped

  # Redis - Caching, PubSub, Rate Limiting, Job Queue
  redis:
    image: redis:7-alpine
    container_name: broadcast-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - broadcast-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: broadcast-prometheus
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - broadcast-network
    restart: unless-stopped

  # Grafana - Monitoring Dashboards
  #
  # GRAFANA_ADMIN_USER and GRAFANA_PASSWORD must be set in `.env`. We refuse to
  # boot with the upstream `admin/admin` defaults because those credentials are
  # publicly known.
  grafana:
    image: grafana/grafana:latest
    container_name: broadcast-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - broadcast-network
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  broadcast-network:
    driver: bridge