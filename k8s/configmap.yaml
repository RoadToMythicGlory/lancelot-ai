apiVersion: v1
kind: ConfigMap
metadata:
  name: lancelot-config
  namespace: lancelot
data:
  # Database
  DATABASE_URL: "postgresql://lancelot:$(POSTGRES_PASSWORD)@postgres-service:5432/lancelot"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # MongoDB
  MONGODB_URL: "mongodb://LancelotERP_DB:$(MONGO_PASSWORD)@mongodb-service:27017/lancelot?authSource=admin"
  
  # OpenSearch
  OPENSEARCH_URL: "http://opensearch-service:9200"
  
  # MinIO
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET_NAME: "lancelot-files"
  
  # Keycloak
  KEYCLOAK_URL: "http://keycloak-service:8080"
  KEYCLOAK_REALM: "lancelot"
  KEYCLOAK_CLIENT_ID: "lancelot-web"
  
  # API Configuration
  API_PORT: "4000"
  API_PREFIX: "/api/v1"
  GRAPHQL_PATH: "/graphql"
  GRAPHQL_PLAYGROUND: "false"
  
  # Frontend URLs
  NEXT_PUBLIC_API_URL: "https://api.lancelot.example.com"
  NEXT_PUBLIC_GRAPHQL_URL: "https://api.lancelot.example.com/graphql"
  NEXT_PUBLIC_WS_URL: "wss://api.lancelot.example.com"
  
  # Locale
  DEFAULT_LOCALE: "he"
  FALLBACK_LOCALE: "en"
  TIMEZONE: "Asia/Jerusalem"
  
  # Features
  ENABLE_EXCEL_IMPORT: "true"
  ENABLE_BARCODE_SCANNER: "true"
  ENABLE_VOICE_COMMANDS: "false"
  ENABLE_AR_OVERLAY: "false"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Email
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  EMAIL_FROM: "Lancelot Platform <noreply@example.com>" 