# Nginx Configuration Example for Lancelot Platform
# Place this in /etc/nginx/sites-available/lancelot and symlink to sites-enabled

# API Server Configuration
server {
    listen 80;
    server_name api.lanceloterp.io;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lanceloterp.io;

    # SSL Configuration (update paths to your certificates)
    ssl_certificate /etc/letsencrypt/live/api.lanceloterp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lanceloterp.io/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Proxy to API Gateway
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_read_timeout 86400;
    }
    
    # Excel Parser proxy (separate service on port 3002)
    location /parse-broadcast-schedule {
        proxy_pass http://localhost:3002/parse-broadcast-schedule;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # GraphQL specific settings
    location /graphql {
        proxy_pass http://localhost:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow larger payloads for GraphQL
        client_max_body_size 10M;
    }
    
    # Socket.io specific settings
    location /socket.io/ {
        proxy_pass http://localhost:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Socket.io specific
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}

# Web Application Configuration
server {
    listen 80;
    server_name lanceloterp.io www.lanceloterp.io;
    
    # Redirect HTTP to HTTPS
    return 301 https://lanceloterp.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.lanceloterp.io;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/lanceloterp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanceloterp.io/privkey.pem;
    
    # Redirect www to non-www
    return 301 https://lanceloterp.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lanceloterp.io;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/lanceloterp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanceloterp.io/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Proxy to Next.js application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files caching
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }
    
    location /static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=3600";
    }
}
