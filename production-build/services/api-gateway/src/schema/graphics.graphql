# Graphics Creation System Schema

enum GraphicsElementType {
  TEXT
  RECTANGLE
  IMAGE
  LOGO
  SHAPE
}

enum ExportStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

enum ExportFormat {
  MXF
  MOV
  MP4
  PNG
  TIFF
}

enum ExportCodec {
  DNXHD
  PRORES
  H264
  UNCOMPRESSED
}

enum AssetType {
  IMAGE
  FONT
  LOGO
  TEMPLATE
  AUDIO
}

type GraphicsElement {
  id: String!
  type: GraphicsElementType!
  content: String
  x: Float!
  y: Float!
  width: Float
  height: Float
  fontSize: Float
  fontFamily: String
  color: String
  backgroundColor: String
  opacity: Float
  rotation: Float
  shadow: Boolean
  shadowColor: String
  shadowBlur: Float
  shadowOffsetX: Float
  shadowOffsetY: Float
  animation: String
  animationDuration: Float
  borderRadius: Float
  borderWidth: Float
  borderColor: String
  gradient: Boolean
  gradientColors: [String!]
  maxWidth: Float
  textAlign: String
  verticalAlign: String
  imageUrl: String
  maskPath: String
  blendMode: String
  filters: JSON
  zIndex: Int
}

type ExportOptions {
  format: ExportFormat!
  codec: ExportCodec!
  resolution: String!
  framerate: Float!
  duration: Float!
  transparency: Boolean!
  quality: Int!
  bitrate: Int
  audioTrack: Boolean
  customSettings: JSON
}

type GraphicsProject {
  id: ID!
  name: String!
  description: String
  template: String!
  elements: [GraphicsElement!]!
  width: Float!
  height: Float!
  duration: Float!
  framerate: Float!
  backgroundColor: String!
  assets: [GraphicsAsset!]
  tags: [String!]!
  isPublic: Boolean!
  version: Int!
  createdBy: User!
  updatedBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type GraphicsExport {
  id: ID!
  projectId: ID!
  project: GraphicsProject
  name: String!
  status: ExportStatus!
  progress: Int!
  options: ExportOptions!
  outputPath: String
  fileName: String
  fileSize: Int
  downloadUrl: String
  error: String
  createdBy: User!
  createdAt: DateTime!
  completedAt: DateTime
}

type GraphicsAsset {
  id: ID!
  name: String!
  description: String
  type: AssetType!
  fileName: String!
  filePath: String!
  fileSize: Int!
  mimeType: String!
  dimensions: AssetDimensions
  metadata: JSON
  tags: [String!]!
  isPublic: Boolean!
  uploadedBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AssetDimensions {
  width: Int!
  height: Int!
}

type GraphicsTemplate {
  id: String!
  name: String!
  description: String!
  category: String!
  previewUrl: String
}

type PreviewResult {
  success: Boolean!
  previewUrl: String
  message: String!
}

# Input Types
input GraphicsElementInput {
  id: String!
  type: GraphicsElementType!
  content: String
  x: Float!
  y: Float!
  width: Float
  height: Float
  fontSize: Float
  fontFamily: String
  color: String
  backgroundColor: String
  opacity: Float
  rotation: Float
  shadow: Boolean
  shadowColor: String
  shadowBlur: Float
  shadowOffsetX: Float
  shadowOffsetY: Float
  animation: String
  animationDuration: Float
  borderRadius: Float
  borderWidth: Float
  borderColor: String
  gradient: Boolean
  gradientColors: [String!]
  maxWidth: Float
  textAlign: String
  verticalAlign: String
  imageUrl: String
  maskPath: String
  blendMode: String
  filters: JSON
  zIndex: Int
}

input ExportOptionsInput {
  format: ExportFormat!
  codec: ExportCodec!
  resolution: String!
  framerate: Float!
  duration: Float!
  transparency: Boolean = false
  quality: Int = 85
  bitrate: Int
  audioTrack: Boolean = false
  customSettings: JSON
}

input GraphicsProjectInput {
  name: String!
  description: String
  template: String!
  elements: [GraphicsElementInput!]!
  width: Float!
  height: Float!
  duration: Float!
  framerate: Float = 25
  backgroundColor: String = "#000000"
  assets: [ID!]
  tags: [String!]
  isPublic: Boolean = false
}

input GraphicsProjectUpdateInput {
  name: String
  description: String
  template: String
  elements: [GraphicsElementInput!]
  width: Float
  height: Float
  duration: Float
  framerate: Float
  backgroundColor: String
  assets: [ID!]
  tags: [String!]
  isPublic: Boolean
}

input ExportProjectInput {
  projectId: ID!
  options: ExportOptionsInput!
}

input PreviewInput {
  projectId: ID!
}

input AssetUploadInput {
  name: String!
  description: String
  type: AssetType!
  tags: [String!]
  isPublic: Boolean = false
}

# Extend existing types
extend type Query {
  # Graphics Projects
  graphicsProjects: [GraphicsProject!]!
  graphicsProject(id: ID!): GraphicsProject
  
  # Graphics Exports
  graphicsExports: [GraphicsExport!]!
  graphicsExport(id: ID!): GraphicsExport
  
  # Graphics Assets
  graphicsAssets(type: AssetType): [GraphicsAsset!]!
  graphicsAsset(id: ID!): GraphicsAsset
  
  # Templates
  graphicsTemplates: [GraphicsTemplate!]!
}

extend type Mutation {
  # Project Management
  createGraphicsProject(input: GraphicsProjectInput!): GraphicsProject!
  updateGraphicsProject(id: ID!, input: GraphicsProjectUpdateInput!): GraphicsProject!
  deleteGraphicsProject(id: ID!): Boolean!
  duplicateGraphicsProject(id: ID!): GraphicsProject!
  
  # Export Operations
  exportGraphicsProject(input: ExportProjectInput!): GraphicsExport!
  generatePreview(input: PreviewInput!): PreviewResult!
  
  # Asset Management
  uploadAsset(file: Upload!, input: AssetUploadInput!): GraphicsAsset!
  updateAsset(id: ID!, input: AssetUploadInput!): GraphicsAsset!
  deleteAsset(id: ID!): Boolean!
}
