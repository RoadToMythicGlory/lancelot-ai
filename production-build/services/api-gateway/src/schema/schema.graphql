# ================== CHAT SYSTEM (Private Conversations) ==================

# A private conversation between two users
type PrivateConversation {
  id: ID!
  participant1: User!
  participant2: User!
  unreadCount: Int!
  lastMessageAt: DateTime
}

# A message within a private conversation
type PrivateMessage {
  id: ID!
  conversationId: ID!
  message: String!
  messageType: String
  fromUser: User!
  isRead: Boolean!
  createdAt: DateTime!
}

extend type Query {
  # Current user's private conversations
  privateConversations: [PrivateConversation!]!

  # Messages of a private conversation
  conversationMessages(conversationId: ID!, limit: Int, offset: Int): [PrivateMessage!]!
}

extend type Mutation {
  # Create a conversation with a user or return the existing one
  createOrGetConversation(userId: ID!): PrivateConversation!

  # Send a message to a private conversation
  sendPrivateMessage(conversationId: ID!, message: String!, messageType: String): PrivateMessage!

  # Mark all messages in a conversation as read for the current user
  markMessagesAsRead(conversationId: ID!): Boolean!
}

