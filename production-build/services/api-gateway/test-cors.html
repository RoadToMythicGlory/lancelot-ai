<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testCORS()">Test GraphQL CORS</button>
    <div id="result"></div>
    
    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:4000/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        query: `
                            query {
                                health {
                                    status
                                    timestamp
                                    service
                                }
                            }
                        `
                    })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `<pre>Success! Response:\n${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<pre style="color: red;">Error:\n${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
