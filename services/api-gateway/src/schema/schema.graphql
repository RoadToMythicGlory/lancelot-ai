# Warehouse Equipment types
type WarehouseEquipment {
  id: ID!
  name: String!
  category: String!
  brand: String
  barcode: String!
  status: String!
  condition: String
  quantityTotal: Int!
  quantityAvailable: Int!
  quantityAssigned: Int!
  currentLocation: String
  
  # Additional details
  price: Float
  purchaseDate: DateTime
  warrantyExpiryDate: DateTime
  company: String
  equipmentModel: String
  contactPerson: String
  manualLink: String
  imageUrl: String
  
  # Storage location — `warehouseId` / `storagePlaceId` is the new
  # canonical reference (resolved as `warehouse` / `storagePlace`), the
  # legacy `storage { row, shelf, cell }` is preserved for items that
  # haven't been reassigned to a configured warehouse yet.
  warehouseId: ID
  storagePlaceId: ID
  warehouse: Warehouse
  storagePlace: WarehouseStoragePlace
  storage: StorageLocation
  
  # Quantity-based items use pool tracking instead of per-unit barcodes
  isQuantityBased: Boolean!

  # Shared engineering equipment ("ציוד הנדסה שיתופי") — flagged inventory
  # that MCR tracks separately whenever it is assigned to an event or staff.
  isSharedEngineeringEquipment: Boolean!

  # Equipment state
  isDisabled: Boolean!
  disabledAt: DateTime
  disabledBy: User
  disabledReason: String
  suspensionStatus: String
  
  # Activity tracking
  lastUsedAt: DateTime
  
  createdAt: DateTime!
  updatedAt: DateTime!
}

type WarehouseEquipmentStats {
  totalEquipment: Int!
  totalAvailable: Int!
  totalAssigned: Int!
  totalMaintenance: Int!
  totalDisabled: Int!
}

# Slim equipment shape returned by `warehouseEquipmentForPicker`. Keep this
# narrow on purpose — adding fields here means raising the payload for the
# 5000-item picker query.
type WarehouseEquipmentPickerItem {
  id: ID!
