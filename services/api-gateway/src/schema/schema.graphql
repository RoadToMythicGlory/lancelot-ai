# ==================== Flight Board ====================
#
# Flight Boards are saved live-operations dashboards. Each board is a grid of
# panels (table / chart / KPI / timeline) configured by an admin. The list
# of operational items shown inside the board is computed on demand by the
# `flightBoardData` query, which aggregates rows across the existing event
# entities (broadcasts, MCR events, etc.) into one normalized shape.

enum FlightBoardItemType {
  BROADCAST
  STREAM
  MCR
  PODCAST
  POST
  PROJECT
  EXTERNAL
  MANUAL
  # One row per MCR Schedule activity row. Used by the MCR Flight Board
  # variant — each item maps 1:1 to an ActivityRow document.
  ACTIVITY
}

enum FlightBoardPanelType {
  TABLE
  BAR_CHART
  LINE_CHART
  PIE_CHART
  AREA_CHART
  KPI
  TIMELINE
}

enum FlightBoardPanelWidth {
  QUARTER
  THIRD
  HALF
  TWO_THIRDS
  FULL
}

enum FlightBoardSortDirection {
  ASC
  DESC
}

enum FlightBoardChartMetric {
  COUNT
  PEAK_VIEWERS
  AVG_VIEWERS
  TOTAL_REVENUE
  DURATION
}

enum FlightBoardVisibility {
  ALL
  ADMINS_ONLY
}

enum FlightBoardDateRangePreset {
  TODAY
  YESTERDAY
  THIS_WEEK
  THIS_MONTH
  ALL
  CUSTOM
}

type FlightBoardPanel {
  id: ID!
  panelKey: String!
  title: String!
  type: FlightBoardPanelType!
  width: FlightBoardPanelWidth!
  itemTypes: [FlightBoardItemType!]!
  visibleColumns: [String!]!
  chartGroupBy: String
  chartMetric: FlightBoardChartMetric
  sortField: String
  sortDirection: FlightBoardSortDirection!
  rowLimit: Int
  """When true, rows whose broadcast location is "יעלה לווין בלבד"
  (satellite-only) are hidden from this panel."""
  hideSatellites: Boolean!
  order: Int!
}

type FlightBoard {
  id: ID!
  title: String!
  description: String
  refreshIntervalSec: Int!
  visibility: FlightBoardVisibility!
  isDefault: Boolean!
  panels: [FlightBoardPanel!]!
  createdBy: User
  updatedBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FlightBoardItem {
  id: ID!
  type: FlightBoardItemType!
  title: String!
  date: DateTime
  startTime: DateTime
  endTime: DateTime
  channel: String
  status: String
  description: String
  notes: String
  raw: JSON
  """Stable key in the form `${type}:${sourceId}` (or `MANUAL:${rowId}`).
  Used by the overlay system to address rows for hide/edit/delete."""
  itemKey: String!
  """True when this row originated from the board's manual-row overlay."""
  isManual: Boolean!
  """Panel scope for manual rows; null/empty means visible across all
  TABLE panels of the board."""
  panelKey: String
  """True when an admin override has modified one or more columns of a
  source row on this board."""
  hasOverride: Boolean!
}

type FlightBoardManualRow {
  rowId: ID!
  panelKey: String
  values: JSON!
  createdAt: DateTime
  updatedAt: DateTime
}

type FlightBoardItemOverride {
  itemKey: String!
  values: JSON!
  updatedAt: DateTime
}

type FlightBoardOverlay {
  hiddenItemKeys: [String!]!
  manualRows: [FlightBoardManualRow!]!
  itemOverrides: [FlightBoardItemOverride!]!
}

type FlightBoardData {
  boardId: ID!
  rangeStart: DateTime
  rangeEnd: DateTime
  rangePreset: FlightBoardDateRangePreset!
  generatedAt: DateTime!
  items: [FlightBoardItem!]!
  overlay: FlightBoardOverlay!
}

input FlightBoardPanelInput {
  panelKey: String
  title: String!
  type: FlightBoardPanelType!
  width: FlightBoardPanelWidth!
  itemTypes: [FlightBoardItemType!]
  visibleColumns: [String!]
  chartGroupBy: String
  chartMetric: FlightBoardChartMetric
  sortField: String
  sortDirection: FlightBoardSortDirection
  rowLimit: Int
  hideSatellites: Boolean
  order: Int
}

input CreateFlightBoardInput {
  title: String!
  description: String
  refreshIntervalSec: Int
  visibility: FlightBoardVisibility
  isDefault: Boolean
  panels: [FlightBoardPanelInput!]
}

input UpdateFlightBoardInput {
  title: String
  description: String
  refreshIntervalSec: Int
  visibility: FlightBoardVisibility
  isDefault: Boolean
  panels: [FlightBoardPanelInput!]
}

input FlightBoardDateRangeInput {
  preset: FlightBoardDateRangePreset!
  start: DateTime
  end: DateTime
}

extend type Query {
  flightBoards: [FlightBoard!]!
  flightBoard(id: ID!): FlightBoard
  flightBoardData(boardId: ID!, range: FlightBoardDateRangeInput!): FlightBoardData!
}

input FlightBoardManualRowInput {
  panelKey: String
  values: JSON
}

extend type Mutation {
  createFlightBoard(input: CreateFlightBoardInput!): FlightBoard!
  updateFlightBoard(id: ID!, input: UpdateFlightBoardInput!): FlightBoard!
  deleteFlightBoard(id: ID!): Boolean!
  setDefaultFlightBoard(id: ID!): FlightBoard!

  """Add a board-only manual row. Optionally scoped to a single TABLE panel."""
  addFlightBoardManualRow(boardId: ID!, input: FlightBoardManualRowInput!): FlightBoard!
  """Replace the column values of an existing manual row."""
  updateFlightBoardManualRow(boardId: ID!, rowId: ID!, values: JSON!): FlightBoard!
  """Remove a manual row from the board overlay."""
  deleteFlightBoardManualRow(boardId: ID!, rowId: ID!): FlightBoard!

  """Hide a source row (`${type}:${id}`) from this board only."""
  hideFlightBoardItem(boardId: ID!, itemKey: String!): FlightBoard!
  """Restore a previously hidden source row."""
  unhideFlightBoardItem(boardId: ID!, itemKey: String!): FlightBoard!

  """Set per-column overrides for a source row on this board.
  Pass `null` for a column key to clear that single override."""
  setFlightBoardItemOverride(boardId: ID!, itemKey: String!, values: JSON!): FlightBoard!
  """Drop all overrides for a source row on this board."""
  clearFlightBoardItemOverride(boardId: ID!, itemKey: String!): FlightBoard!
}