# Department type
type Department {
  id: ID!
  name: String!
  hebrewName: String
  code: String
  createdAt: DateTime!
  # New fields
  category: String!
  # Legacy: list of role names. Prefer `departmentRoles` for full role definitions.
  roles: [String!]!
  description: String
  isActive: Boolean!
  updatedAt: DateTime!
  # New richer role definitions with permission grants.
  departmentRoles: [DepartmentRoleDef!]!
  # Other department codes treated as part of this department for staffing/listing.
  includesDepartmentCodes: [String!]!
  # Free-form additional permission strings granted by the department itself.
  permissions: [String!]!
}

# Definition of a role inside a department.
