extend type Query {
  # MCR Events
  mcrEvents(
    start: DateTime
    end: DateTime
    broadcastType: BroadcastType
  ): [MCREvent!]!
  
  mcrEvent(id: ID!): MCREvent
  
  # Bulletin Posts
  mcrBulletinPosts(
    departmentId: ID
    activeOnly: Boolean
  ): [MCRBulletinPost!]!
  
  mcrBulletinPost(id: ID!): MCRBulletinPost
  
  # Activity Rows
  activityRows(
    date: DateTime!
    includeHidden: Boolean
  ): [ActivityRow!]!
  
  activityRow(id: ID!): ActivityRow
  activityRowByBroadcastEvent(broadcastEventId: ID!, date: DateTime!): ActivityRow

  # Daily Checks
  mcrDailyCheckTemplates(activeOnly: Boolean): [MCRDailyCheckTemplate!]!
  mcrDailyCheck(date: DateTime!): MCRDailyCheckSummary!

  # External Exchange
  mcrExchangeGroups(status: MCRExchangeStatus, mcrEventId: ID): [MCRExchangeGroup!]!
  mcrExchangeGroup(id: ID!): MCRExchangeGroup

  # Shared engineering equipment tracking ("ציוד הנדסה שיתופי").
  # Returns every active allocation of equipment that is flagged as shared
  # engineering, whether the allocation targets a broadcast event (shown to
  # MCR via the linked shadow event) or a staff member (internal worker
  # dispatch). Pass `status: "all"` to include returned / transferred /
  # cancelled rows; defaults to active.
  mcrSharedEngineeringEquipment(
    status: String = "active"
  ): MCRSharedEngineeringTracking!
}

type MCRSharedEngineeringTracking {
  eventAssignments: [MCRSharedEngineeringEventAssignment!]!
  staffAssignments: [MCRSharedEngineeringStaffAssignment!]!
  availableEquipment: [MCRSharedEngineeringWarehouseEquipment!]!
}

