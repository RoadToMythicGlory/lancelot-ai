# Root Types
type Query {
  # Health check
  health: HealthCheck!
  
  # User Management
  users(filter: UserFilter): [User!]!
  user(id: ID!): User
  me: User
  usersByDepartment(departmentId: String!): [User!]!
  usersBySystemRole(systemRole: SystemRole!): [User!]!
  
  # Broadcast Events
  broadcastEvents(startDate: DateTime, endDate: DateTime): [BroadcastEvent!]!
  broadcastEvent(id: ID!): BroadcastEvent
  
  # Departments
  departments: [Department!]!
  department(code: String!): Department
  departmentById(id: ID!): Department

  # Assignment form configuration
  assignmentFormConfigs: [AssignmentFormConfig!]!
  assignmentFormConfig(formKey: String!): AssignmentFormConfig

  # Assignment presets (shared, per-form)
  assignmentPresets(formKey: String!): [AssignmentPreset!]!
  assignmentPreset(id: ID!): AssignmentPreset
  
  # Warehouse Equipment
  warehouseEquipment(filter: WarehouseEquipmentFilter, limit: Int, offset: Int): [WarehouseEquipment!]!
  warehouseEquipmentStats(filter: WarehouseEquipmentFilter): WarehouseEquipmentStats!
  # Slim projection of every active equipment row for picker UIs (e.g. the
  # equipment-sets Preset Items selector). Up to 5000 items, name-sorted,
  # optionally filtered by a free-text `search` over name/barcode/model.
  warehouseEquipmentForPicker(search: String): [WarehouseEquipmentPickerItem!]!
  # Distinct, sorted list of categories present in the active (non-disabled)
  # equipment catalog. Used to populate the warehouse list category filter
  # without having to download the full catalog client-side.
  # DEPRECATED: prefer `equipmentCategories` which also returns Hebrew labels
  # and is the single source of truth across the app.
  warehouseEquipmentCategories: [String!]!

  # Single source of truth catalog for equipment categories. Returns every
  # active category by default; pass `includeInactive: true` to also fetch
  # soft-disabled ones (e.g. for the admin management screen).
  equipmentCategories(includeInactive: Boolean = false): [EquipmentCategory!]!
  
  # Equipment Assignments
  equipmentAssignmentsByEvent(broadcastEventId: ID!): [EquipmentAssignment!]!
  equipmentAssignments(equipmentId: ID!): [EquipmentAssignment!]!
  equipmentHistory(equipmentId: ID!): [EquipmentHistory!]!

  # All broadcast events that currently have equipment "out" of the warehouse
  # (active EquipmentAssignment records OR equipment embedded in event metadata).
  # Not date-filtered — used by the equipment return UI.
  eventsWithAssignedEquipment: [BroadcastEvent!]!

  # Equipment Sets
  equipmentSets: [EquipmentSet!]!
  equipmentSet(id: ID!): EquipmentSet
  equipmentSetByBarcode(barcode: String!): EquipmentSet

  # Stale equipment (unused for N days)
  staleEquipment(daysUnused: Int = 14): [WarehouseEquipment!]!

  # Internal equipment assignments (worker-based dispatch).
  # status filter: 'active' | 'returned' | 'transferred' | 'cancelled' | 'all'.
  # Defaults to 'active' to keep the warehouse tab focused on what's "out".
  internalEquipmentAssignments(status: String = "active"): [InternalEquipmentAssignment!]!
  
  # Vendors
  vendors(filter: VendorFilter): [Vendor!]!
  vendor(id: ID!): Vendor

  # Warehouses (physical locations with manually-managed storage places)
  warehouses(filter: WarehouseFilter): [Warehouse!]!
  warehouse(id: ID!): Warehouse
  
  # ===== SHIFTS QUERIES =====
  # Shifts
  shifts(startDate: String!, endDate: String!, department: String, userId: String): [Shift!]!
  shift(id: ID!): Shift
  myUpcomingShifts(limit: Int = 10): [Shift!]!
  
  # Shift Templates
  shiftTemplates(department: String, active: Boolean): [ShiftTemplate!]!
  shiftTemplate(id: ID!): ShiftTemplate
  
  # Shift Role Templates
  shiftRoleTemplates(departmentId: String!): [ShiftRoleTemplate!]!
  shiftRoleTemplate(id: ID!): ShiftRoleTemplate
  
  # Shift Swap Requests
  shiftSwapRequests(status: RequestStatus, userId: String): [ShiftSwapRequest!]!
  shiftSwapRequest(id: ID!): ShiftSwapRequest
  myShiftSwapRequests: [ShiftSwapRequest!]!
  incomingShiftSwapRequests(status: RequestStatus): [ShiftSwapRequest!]!
  
  # Vacation Requests
  vacationRequests(status: RequestStatus, userId: String): [VacationRequest!]!
  vacationRequest(id: ID!): VacationRequest
  myVacationRequests: [VacationRequest!]!
  
  # Availability Constraints
  availabilityConstraints(weekStartDate: String!, userId: String): [AvailabilityConstraint!]!
  myAvailabilityConstraints(weekStartDate: String!): AvailabilityConstraint
  
  # Employee Settings
  employeeSettings(userId: String!): EmployeeSettings
  myEmployeeSettings: EmployeeSettings
  allEmployeeSettings: [EmployeeSettings!]!
  
  # Statistics
  shiftAssignmentStats(weekStartDate: String!): ShiftAssignmentStats!
  employeeShiftStats(userId: String!, startDate: String!, endDate: String!): ShiftAssignmentStats!
  
  # Admin queries
  getShiftsByWeek(weekOffset: Int!): WeekShiftData!
  getShiftTemplates: [ShiftTemplate!]!
  getSpecialRequests(status: String): [SpecialRequest!]!
  getAllShifts(startDate: String, endDate: String): [Shift!]!
  getVacationRequests: [VacationRequest!]!
  
  # User queries
  # Note: users query with filtering is defined in the User Management section above
  
  # Department Shift Configuration
  departmentShiftConfig(departmentId: String!): DepartmentShiftConfig
  myDepartmentShiftConfig: DepartmentShiftConfig
  allDepartmentShiftConfigs: [DepartmentShiftConfig!]!
  
  # New queries for admin dashboard
  employees(department: String): [User!]!
  employee(id: ID!): User
  specialDays: [SpecialDay!]!

  # External Broadcast Presets
  externalBroadcastPresets: [ExternalBroadcastPreset!]!
  externalBroadcastPreset(id: ID!): ExternalBroadcastPreset

  # Venues / stadiums (used by External Broadcasts to hydrate crew +
  # equipment defaults when a venue is selected).
  venues(includeInactive: Boolean): [Venue!]!
  venue(id: ID!): Venue
}

type Mutation {
  # Broadcast Events
  createBroadcastEvent(input: CreateBroadcastEventInput!): BroadcastEvent!
  createBroadcastEventWithOverlapCheck(input: CreateBroadcastEventInput!, forceCreate: Boolean): CreateBroadcastEventResponse!
  updateBroadcastEvent(id: ID!, input: UpdateBroadcastEventInput!): BroadcastEvent!
  deleteBroadcastEvent(id: ID!): Boolean!
  
  # Bulk operations
  createBroadcastEventsFromExcel(events: [ExcelBroadcastEventInput!]!): BulkCreateResponse!
  createBroadcastEventsFromExcelWithOverlapCheck(events: [ExcelBroadcastEventInput!]!, forceCreate: Boolean): BulkCreateResponse!
  deleteBroadcastEventsByDateRange(startDate: DateTime!, endDate: DateTime!): BulkDeleteResponse!
  deleteImportedBroadcastEvents: BulkDeleteResponse!
  
  # Department-specific data
  updateBroadcastEventDepartmentData(eventId: ID!, department: String!, data: DepartmentSpecificDataInput!): BroadcastEvent!
  
  # Warehouse Equipment
  createEquipment(input: CreateEquipmentInput!): WarehouseEquipment!
  updateEquipment(id: ID!, input: UpdateEquipmentInput!): WarehouseEquipment!
  deleteEquipment(id: ID!): Boolean!
  
  # Return equipment from broadcast event
  returnEquipmentFromEvent(eventId: ID!, equipmentIds: [String!]!): EquipmentReturnResponse!
  
  # Transfer equipment between broadcast events
  transferEquipmentBetweenEvents(sourceEventId: ID!, targetEventId: ID!, equipmentIds: [String!]!): TransferEquipmentResponse!
  
  # Equipment Assignment mutations
  createEquipmentAssignment(input: CreateEquipmentAssignmentInput!): EquipmentAssignment!
  updateEquipmentAssignment(id: ID!, input: UpdateEquipmentAssignmentInput!): EquipmentAssignment!
  deleteEquipmentAssignment(id: ID!): Boolean!
  updateWarehouseEquipmentQuantity(id: ID!, quantityChange: Int!): WarehouseEquipment!
  
  # Equipment quantity adjustment
  adjustEquipmentQuantity(id: ID!, adjustment: Int!, reason: String!): WarehouseEquipment!

  # Force-release stuck "ghost-assigned" units. Resets quantityAssigned to 0,
  # cancels every active EquipmentAssignment row for this equipment, and
  # writes a history entry. Use when an event was deleted while units
  # were still checked out, leaving the equipment unrecoverable through
  # the normal Return modal.
  forceReleaseEquipment(id: ID!, reason: String!): WarehouseEquipment!

  # Equipment state management
  disableEquipment(id: ID!, reason: String!, suspensionStatus: String): WarehouseEquipment!
  # `notes` is recorded in EquipmentHistory and surfaced in the disable/enable
  # log shown when re-enabling equipment.
  enableEquipment(id: ID!, notes: String): WarehouseEquipment!
  
  # Undo equipment transfer
  undoEquipmentTransfer(transferId: ID!): TransferEquipmentResponse!

  # Internal Equipment Assignment mutations (worker-based dispatch)
  assignEquipmentToWorker(input: AssignEquipmentToWorkerInput!): InternalEquipmentAssignment!
  returnInternalEquipmentAssignment(assignmentId: ID!, notes: String): InternalEquipmentAssignment!
  transferInternalEquipmentAssignment(input: TransferInternalAssignmentInput!): InternalEquipmentAssignment!

  # Equipment Set mutations
  createEquipmentSet(input: CreateEquipmentSetInput!): EquipmentSet!
  updateEquipmentSet(id: ID!, input: UpdateEquipmentSetInput!): EquipmentSet!
  deleteEquipmentSet(id: ID!): Boolean!
  assignEquipmentSetToEvent(eventId: ID!, setId: ID!): EquipmentReturnResponse!
  returnEquipmentSet(eventId: ID!, setId: ID!, scannedBarcodes: [String!]!, missingEquipmentIds: [ID!], replacements: [EquipmentReplacementInput!]): EquipmentSetReturnResponse!
  
  # Vendor mutations
  createVendor(input: CreateVendorInput!): Vendor!
  updateVendor(id: ID!, input: UpdateVendorInput!): Vendor!
  deleteVendor(id: ID!): Boolean!
  toggleVendorStatus(id: ID!): Vendor!

  # Warehouse mutations
  createWarehouse(input: CreateWarehouseInput!): Warehouse!
  updateWarehouse(id: ID!, input: UpdateWarehouseInput!): Warehouse!
  deleteWarehouse(id: ID!): Boolean!
  createWarehouseStoragePlace(warehouseId: ID!, input: CreateWarehouseStoragePlaceInput!): Warehouse!
  updateWarehouseStoragePlace(warehouseId: ID!, placeId: ID!, input: UpdateWarehouseStoragePlaceInput!): Warehouse!
  deleteWarehouseStoragePlace(warehouseId: ID!, placeId: ID!): Warehouse!

  # EquipmentCategory mutations (admin-only, WAREHOUSE_MANAGE).
  # Slugs are immutable once any equipment references them; `delete` refuses
  # while equipment still uses the slug — admins must set isActive=false.
  createEquipmentCategory(input: EquipmentCategoryInput!): EquipmentCategory!
  updateEquipmentCategory(id: ID!, input: UpdateEquipmentCategoryInput!): EquipmentCategory!
  deleteEquipmentCategory(id: ID!): Boolean!
  
  # ===== SHIFTS MUTATIONS =====
  # Shifts
  createShift(input: ShiftInput!): Shift!
  updateShift(id: ID!, input: ShiftInput!): Shift!
  deleteShift(id: ID!): Boolean!
  assignUserToShift(input: ShiftAssignmentInput!): Shift!
  removeUserFromShift(shiftId: String!, userId: String!): Shift!
  
  # Shift Templates
  createShiftTemplate(input: ShiftTemplateInput!): ShiftTemplate!
  updateShiftTemplate(id: ID!, input: ShiftTemplateInput!): ShiftTemplate!
  deleteShiftTemplate(id: ID!): Boolean!
  generateShiftsFromTemplate(templateId: String!, startDate: String!, endDate: String!): [Shift!]!
  
  # Shift Role Templates
  createShiftRoleTemplate(input: ShiftRoleTemplateInput!): ShiftRoleTemplate!
  updateShiftRoleTemplate(id: ID!, input: ShiftRoleTemplateInput!): ShiftRoleTemplate!
  deleteShiftRoleTemplate(id: ID!): Boolean!
  applyShiftRoleTemplate(templateId: String!, weekStartDate: String!): ApplyTemplateResult!
  
  # Shift Swap Requests
  createShiftSwapRequest(input: ShiftSwapRequestInput!): ShiftSwapRequest!
  cancelShiftSwapRequest(id: ID!): ShiftSwapRequest!
  respondToShiftSwapRequest(id: ID!, accepted: Boolean!, reason: String): ShiftSwapRequest!
  approveShiftSwapRequest(input: ApprovalInput!): ShiftSwapRequest!
  
  # Vacation Requests
  createVacationRequest(input: VacationRequestInput!): VacationRequest!
  updateVacationRequest(id: ID!, input: VacationRequestInput!): VacationRequest!
  deleteVacationRequest(id: ID!): Boolean!
  cancelVacationRequest(id: ID!): VacationRequest!
  approveVacationRequest(input: ApprovalInput!): VacationRequest!
  
  # Availability Constraints
  submitAvailabilityConstraints(input: AvailabilityConstraintInput!): AvailabilityConstraint!
  
  # Employee Settings
  updateEmployeeSettings(input: EmployeeSettingsInput!): EmployeeSettings!
  
  # Authentication
  login(email: String!, password: String!): AuthPayload!
  
  # User Management
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
  updateMyProfile(input: UpdateUserInput!): User!
  changePassword(oldPassword: String!, newPassword: String!): Boolean!
  registerPublicKey(publicKey: String!): Boolean!
  
  # Department Shift Configuration
  createDepartmentShiftConfig(input: DepartmentShiftConfigInput!): DepartmentShiftConfig!
  updateDepartmentShiftConfig(departmentId: String!, input: DepartmentShiftConfigInput!): DepartmentShiftConfig!
  deleteDepartmentShiftConfig(departmentId: String!): Boolean!
  
  # New mutations for admin dashboard
  createSpecialRequest(input: SpecialRequestInput!): SpecialRequest!
  handleSpecialRequest(requestId: String!, approved: Boolean!, adminNotes: String): SpecialRequest!
  sendNotification(input: NotificationInput!): NotificationPayload!
  generateShiftReport(input: ShiftReportInput!): ShiftReport!
  createEmployee(input: CreateEmployeeInput!): User!
  updateSpecialDays(input: SpecialDayInput!): SpecialDay!
  deleteSpecialDay(id: ID!): Boolean!

  # External Broadcast Presets
  createExternalBroadcastPreset(input: CreateExternalBroadcastPresetInput!): ExternalBroadcastPreset!
  updateExternalBroadcastPreset(id: ID!, input: UpdateExternalBroadcastPresetInput!): ExternalBroadcastPreset!
  deleteExternalBroadcastPreset(id: ID!): Boolean!

  # Venues
  createVenue(input: CreateVenueInput!): Venue!
  updateVenue(id: ID!, input: UpdateVenueInput!): Venue!
  deleteVenue(id: ID!): Boolean!

  # Department management
  createDepartment(input: CreateDepartmentInput!): Department!
  updateDepartment(code: String!, input: UpdateDepartmentInput!): Department!
  deleteDepartment(code: String!): Boolean!

  # Assignment form configuration
  upsertAssignmentFormConfig(input: UpsertAssignmentFormConfigInput!): AssignmentFormConfig!
  deleteAssignmentFormConfig(formKey: String!): Boolean!

  # Assignment presets
  createAssignmentPreset(input: CreateAssignmentPresetInput!): AssignmentPreset!
  updateAssignmentPreset(id: ID!, input: UpdateAssignmentPresetInput!): AssignmentPreset!
  deleteAssignmentPreset(id: ID!): Boolean!
}

# Authentication types
type AuthPayload {
  token: String!
  user: User!
}

# ===== SUBSCRIPTIONS =====
type Subscription {
  # Broadcast event updates. Pass `departmentId` to receive department-scoped
  # updates only; omit it to subscribe to the global stream (still gated by
  # BROADCAST_VIEW on the resolver).
  broadcastEventUpdated(departmentId: ID): BroadcastEvent!

  # ===== SHIFTS SUBSCRIPTIONS =====
  shiftUpdated(userId: String): Shift!
  shiftSwapRequestUpdated(userId: String): ShiftSwapRequest!
  vacationRequestUpdated(userId: String): VacationRequest!
}

