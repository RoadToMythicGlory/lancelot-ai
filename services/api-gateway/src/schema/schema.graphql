  updatedAt: DateTime!
}

type PresetRole {
  roleKey: String!
  roleLabel: String!
  count: Int!
  isCustom: Boolean!
}

"""
Item-based equipment requirement on a preset. Each row points at a specific
`Equipment` document via `equipmentId` and carries the per-line `quantity`,
`purpose` and `audioConfig` directly. The legacy fields (`count`,
`unitSettings`) are kept optional for read-only fallback so old presets
saved under the previous category-based shape keep rendering until
re-saved.
"""
type PresetEquipment {
  equipmentId: String
  equipmentName: String
  category: String!
  categoryLabel: String!
  quantity: Int

  purpose: String
  audioConfig: String

  # Legacy read-only fallback. New presets never populate these.
  count: Int
  unitSettings: [UnitSetting!]
}

type UnitSetting {
  unitIndex: Int!
  purpose: String
  audioConfig: String
  assignedEquipmentId: String
  assignedEquipmentName: String
}

input CreateExternalBroadcastPresetInput {
  name: String!
  description: String
  tags: [String!]
  roles: [PresetRoleInput!]!
  equipment: [PresetEquipmentInput!]
}

