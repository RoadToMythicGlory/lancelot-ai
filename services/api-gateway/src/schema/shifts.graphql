# Shifts Management System Schema

# Enums
# Note: ShiftType is now a String to support dynamic shift types configured per department

enum AvailabilityStatus {
  available
  unavailable
  prefer
  prefer_not
}

enum VacationType {
  annual
  sick
  personal
  maternity
  other
}

enum RequestStatus {
  pending
  approved
  rejected
  cancelled
}

# Types
type Shift {
  id: ID!
  date: String!
  shiftType: String!
  startTime: String
  endTime: String
  department: String!
  requiredWorkers: Int!
  assignedWorkers: [ShiftAssignment!]!
  templateId: String
  notes: String
  status: String
  user: User
  createdAt: String!
  updatedAt: String!
}

type ShiftAssignment {
  userId: String!
  user: User
  role: String!
  assignedAt: String!
  assignedBy: String
}

type ShiftTemplate {
  id: ID!
  name: String!
  dayOfWeek: Int!
  shiftType: String!
  startTime: String!
  endTime: String!
  department: String!
  departments: [String!]!
  daysOfWeek: [Int!]!
  requiredWorkers: Int!
  defaultRoles: [RoleRequirement!]
  active: Boolean!
  isActive: Boolean!
  createdAt: String!
  updatedAt: String!
}

type RoleRequirement {
  role: String!
  count: Int!
}

type ShiftSwapRequest {
  id: ID!
  requestingUserId: String!
  requestingUser: User
  shiftId: String!
  shift: Shift
  targetUserId: String!
  targetUser: User
  reason: String
  status: RequestStatus!
  adminNotes: String
  approvedBy: String
  approvedByUser: User
  approvedAt: String
  createdAt: String!
  updatedAt: String!
}

type VacationRequest {
  id: ID!
  userId: String!
  user: User
  startDate: String!
  endDate: String!
  vacationType: VacationType!
  reason: String
  status: RequestStatus!
  adminNotes: String
  approvedBy: String
  approvedByUser: User
  approvedAt: String
  createdAt: String!
  updatedAt: String!
}

type AvailabilityConstraint {
  id: ID!
  userId: String!
  user: User
  weekStartDate: String!
  constraints: [ConstraintItem!]!
  submittedAt: String
  createdAt: String!
  updatedAt: String!
}

type ConstraintItem {
  dayOfWeek: Int!
  shiftType: String!
  availability: AvailabilityStatus!
}

type EmployeeSettings {
  id: ID!
  userId: String!
  user: User
  roles: [String!]
  teams: [String!]
  employmentPercentage: Int
  constraintDeadline: ConstraintDeadline
  restrictions: [EmployeeRestriction!]
  createdAt: String!
  updatedAt: String!
}

type ConstraintDeadline {
  dayOfWeek: Int!
  hour: Int!
}

type EmployeeRestriction {
  type: String!
  description: String!
  active: Boolean!
}

type ShiftAssignmentStats {
  weekStartDate: String!
  totalShifts: Int!
  assignedShifts: Int!
  unassignedShifts: Int!
  assignmentPercentage: Float!
  departmentStats: [DepartmentShiftStats!]
}

type DepartmentShiftStats {
  department: String!
  totalShifts: Int!
  assignedShifts: Int!
  unassignedShifts: Int!
  assignmentPercentage: Float!
}

# New type for week view
type WeekShiftData {
  weekStart: String!
  weekEnd: String!
  completionPercentage: Float!
  shifts: [Shift!]!
  stats: ShiftWeekStats!
}

type ShiftWeekStats {
  total: Int!
  assigned: Int!
  unassigned: Int!
}

# Special Request type
type SpecialRequest {
  id: ID!
  user: User!
  type: String!
  date: String!
  shiftType: String
  reason: String!
  status: String!
  createdAt: String!
}

# Input Types
input ShiftInput {
  date: String!
  shiftType: String!
  department: String!
  requiredWorkers: Int!
  notes: String
  templateId: String
  startTime: String
  endTime: String
}

input ShiftTemplateInput {
  name: String!
  dayOfWeek: Int!
  shiftType: String!
  department: String!
  requiredWorkers: Int!
  defaultRoles: [RoleRequirementInput!]
  active: Boolean
}

input RoleRequirementInput {
  role: String!
  count: Int!
}

input ShiftAssignmentInput {
  shiftId: String!
  userId: String!
  role: String!
}

input ShiftSwapRequestInput {
  shiftId: String!
  targetUserId: String!
  reason: String
}

input VacationRequestInput {
  userId: String  # Optional - if provided by admin, creates request for this user
  startDate: String!
  endDate: String!
  vacationType: VacationType!
  reason: String
}

input AvailabilityConstraintInput {
  weekStartDate: String!
  constraints: [ConstraintItemInput!]!
}

input ConstraintItemInput {
  dayOfWeek: Int!
  shiftType: String!
  availability: AvailabilityStatus!
}

input EmployeeSettingsInput {
  userId: String!
  roles: [String!]
  teams: [String!]
  employmentPercentage: Int
  constraintDeadline: ConstraintDeadlineInput
  restrictions: [EmployeeRestrictionInput!]
}

input ConstraintDeadlineInput {
  dayOfWeek: Int!
  hour: Int!
}

input EmployeeRestrictionInput {
  type: String!
  description: String!
  active: Boolean!
}

input ApprovalInput {
  requestId: String!
  approved: Boolean!
  adminNotes: String
}

# Queries
type Query {
  # Shifts
  shifts(startDate: String!, endDate: String!, department: String, userId: String): [Shift!]!
  shift(id: ID!): Shift
  myUpcomingShifts(limit: Int = 10): [Shift!]!
  
  # Shift Templates
  shiftTemplates(department: String, active: Boolean): [ShiftTemplate!]!
  shiftTemplate(id: ID!): ShiftTemplate
  
  # Shift Swap Requests
  shiftSwapRequests(status: RequestStatus, userId: String): [ShiftSwapRequest!]!
  shiftSwapRequest(id: ID!): ShiftSwapRequest
  myShiftSwapRequests: [ShiftSwapRequest!]!
  incomingShiftSwapRequests(status: RequestStatus): [ShiftSwapRequest!]!
  
  # Vacation Requests
  vacationRequests(status: RequestStatus, userId: String): [VacationRequest!]!
  vacationRequest(id: ID!): VacationRequest
  myVacationRequests: [VacationRequest!]!
  
  # Availability Constraints
  availabilityConstraints(weekStartDate: String!, userId: String): [AvailabilityConstraint!]!
  myAvailabilityConstraints(weekStartDate: String!): AvailabilityConstraint
  
  # Employee Settings
  employeeSettings(userId: String!): EmployeeSettings
  myEmployeeSettings: EmployeeSettings
  allEmployeeSettings: [EmployeeSettings!]!
  
  # Statistics
  shiftAssignmentStats(weekStartDate: String!): ShiftAssignmentStats!
  employeeShiftStats(userId: String!, startDate: String!, endDate: String!): ShiftAssignmentStats!
  
  # Admin queries
  getShiftsByWeek(weekOffset: Int!): WeekShiftData!
  getShiftTemplates: [ShiftTemplate!]!
  getSpecialRequests(status: String): [SpecialRequest!]!
  getAllShifts(startDate: String, endDate: String): [Shift!]!
  getVacationRequests: [VacationRequest!]!
  
  # User queries
  users: [User!]!
}

# Mutations
type Mutation {
  # Shifts
  createShift(input: ShiftInput!): Shift!
  updateShift(id: ID!, input: ShiftInput!): Shift!
  deleteShift(id: ID!): Boolean!
  assignUserToShift(input: ShiftAssignmentInput!): Shift!
  removeUserFromShift(shiftId: String!, userId: String!): Shift!
  
  # Shift Templates
  createShiftTemplate(input: ShiftTemplateInput!): ShiftTemplate!
  updateShiftTemplate(id: ID!, input: ShiftTemplateInput!): ShiftTemplate!
  deleteShiftTemplate(id: ID!): Boolean!
  generateShiftsFromTemplate(templateId: String!, startDate: String!, endDate: String!): [Shift!]!
  
  # Shift Swap Requests
  createShiftSwapRequest(input: ShiftSwapRequestInput!): ShiftSwapRequest!
  cancelShiftSwapRequest(id: ID!): ShiftSwapRequest!
  approveShiftSwapRequest(input: ApprovalInput!): ShiftSwapRequest!
  
  # Vacation Requests
  createVacationRequest(input: VacationRequestInput!): VacationRequest!
  cancelVacationRequest(id: ID!): VacationRequest!
  approveVacationRequest(input: ApprovalInput!): VacationRequest!
  
  # Availability Constraints
  submitAvailabilityConstraints(input: AvailabilityConstraintInput!): AvailabilityConstraint!
  
  # Employee Settings
  updateEmployeeSettings(input: EmployeeSettingsInput!): EmployeeSettings!
}

# Subscriptions
type Subscription {
  shiftUpdated(userId: String): Shift!
  shiftSwapRequestUpdated(userId: String): ShiftSwapRequest!
  vacationRequestUpdated(userId: String): VacationRequest!
} 